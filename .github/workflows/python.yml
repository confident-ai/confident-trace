# Generated layout is checked by scripts/ci/test_runner.py.
name: Python
on: [push, pull_request]
jobs:
  suite:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: openai
            name: "OpenAI"
          - suite: anthropic
            name: "Anthropic"
          - suite: google-genai
            name: "Google GenAI"
          - suite: bedrock
            name: "Bedrock"
          - suite: google-adk
            name: "Google ADK"
          - suite: agentcore
            name: "AgentCore"
          - suite: strands
            name: "Strands"
          - suite: pydantic-ai
            name: "Pydantic AI"
          - suite: microsoft
            name: "Microsoft Agent Framework"
          - suite: openai-agents
            name: "OpenAI Agents"
          - suite: claude-agent
            name: "Claude Agent SDK"
          - suite: langchain
            name: "LangChain / LangGraph"
          - suite: crewai
            name: "CrewAI"
          - suite: llamaindex
            name: "LlamaIndex"
          - suite: agno
            name: "Agno"
          - suite: smolagents
            name: "smolagents"
          - suite: core
            name: "Core"
          - suite: quality
            name: "Build & quality"
          - suite: interop
            name: "Interoperability"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-grouped-pip-${{ hashFiles('python/pyproject.toml', 'python/tests/constraints/*.txt', 'python/examples/mega/requirements.txt') }}
          restore-keys: ${{ runner.os }}-grouped-pip-
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.10 3.11 3.12 3.13
      - name: Run all compatibility combinations
        run: python3 scripts/ci/run.py python "${{ matrix.suite }}"
      - name: Upload results and logs
        id: reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.suite }}
          path: ci-results/python/${{ matrix.suite }}/
          if-no-files-found: error
      - name: Link reports
        if: always() && steps.reports.outputs.artifact-url != ''
        env:
          REPORT_URL: ${{ steps.reports.outputs.artifact-url }}
        run: echo "[Download per-combination logs and test reports]($REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"
