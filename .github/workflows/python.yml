name: Python
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
        dependencies: [minimum, latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e './python[test]' build ruff
      - if: matrix.dependencies == 'minimum'
        run: >-
          python -m pip install
          opentelemetry-api==1.39.0 opentelemetry-sdk==1.39.0
          opentelemetry-exporter-otlp-proto-http==1.39.0
          opentelemetry-exporter-otlp-proto-grpc==1.39.0
          openai==1.109.0 anthropic==0.69.0 google-genai==1.40.0 wrapt==1.17.3 boto3==1.40.0 botocore==1.40.0
      - run: python tools/generate_genai.py --check --base "$REGISTRY_BASE"
        env:
          REGISTRY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: ruff check python tools
      - run: ruff format --check python tools
      - run: pytest python/tests
      - run: cmp LICENSE python/LICENSE
      - run: python -m build python
