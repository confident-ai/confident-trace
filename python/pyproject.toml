[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "confident-trace"
version = "0.1.7"
description = "OpenTelemetry-first tracing for AI applications"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "opentelemetry-api>=1.39,<2",
  "opentelemetry-sdk>=1.39,<2",
  "opentelemetry-instrumentation-asgi>=0.60b0,<1",
  "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.39,<2",
  "wrapt>=1.17,<3",
]

[project.optional-dependencies]
openai-agents = ["openinference-instrumentation-openai-agents>=2.2.1,<3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/confident_trace"]

[tool.ruff]
target-version = "py310"

[tool.ruff.format]
exclude = ["src/confident_trace/_semconv/genai_v1_37_0.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
